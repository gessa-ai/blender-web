<!DOCTYPE html>
<!--
SPDX-FileCopyrightText: 2026 blender-web contributors
SPDX-License-Identifier: GPL-2.0-or-later

Standalone harness page for the GHOST-web event layer. Real browser input over the
canvas is translated by GHOST_SystemWeb/EventBridgeWeb into GHOST events, dispatched
through the REAL GHOST_EventManager to a logging consumer, and shown below.
-->
<html lang="en">
<head>
  <meta charset="utf-8" />
  <link rel="icon" href="data:," />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>GHOST-web event harness</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body { margin: 0; font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
           background: #14171c; color: #d6dce4; }
    header { padding: 12px 20px; background: #1b1f26; border-bottom: 1px solid #2b313b; }
    header h1 { margin: 0; font-size: 15px; font-weight: 600; }
    header .sub { color: #8791a0; font-size: 12px; margin-top: 2px; }
    main { display: flex; gap: 16px; padding: 16px 20px 40px; flex-wrap: wrap; }
    #blender-canvas {
      width: 480px; height: 320px; background: #0e1116;
      border: 2px dashed #3a4658; border-radius: 6px; outline: none; touch-action: none;
      display: block;
    }
    #blender-canvas:focus { border-color: #2a5db0; }
    .panel { flex: 1; min-width: 320px; }
    .hint { font-size: 12px; color: #8791a0; margin: 0 0 8px; }
    #log { margin: 0; padding: 10px 12px; background: #0e1116; border: 1px solid #2b313b;
           border-radius: 6px; font: 12px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace;
           color: #cfd6df; white-space: pre-wrap; max-height: 60vh; overflow: auto; }
    #log .sys { color: #7f8aa0; font-style: italic; }
    button { font: 12px/1 inherit; padding: 6px 11px; border-radius: 5px; border: 1px solid #3a4250;
             background: #232933; color: #d6dce4; cursor: pointer; margin-bottom: 8px; }
  </style>
</head>
<body>
  <header>
    <h1>GHOST-web event harness</h1>
    <div class="sub">real browser input &rarr; GHOST_SystemWeb/EventBridgeWeb &rarr; real GHOST_EventManager &rarr; logged below</div>
  </header>
  <main>
    <div>
      <canvas id="blender-canvas" width="480" height="320" tabindex="0"></canvas>
      <p class="hint">Move / click / right-click / scroll / type over the canvas.<br />
        Keyboard callbacks are currently canvas-scoped; click the canvas before typing.</p>
    </div>
    <div class="panel">
      <button id="fullscreen">Toggle fullscreen</button>
      <button id="clear">Clear log</button>
      <pre id="log"></pre>
    </div>
  </main>

  <script src="/build/diagnostics-bootstrap.js"></script>
  <script src="/build/ghost_web_test.js"></script>
  <script src="/boot-ghost.js"></script>
</body>
</html>
