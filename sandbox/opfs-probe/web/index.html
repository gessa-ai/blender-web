<!DOCTYPE html>
<!--
SPDX-FileCopyrightText: 2026 blender-web contributors
SPDX-License-Identifier: GPL-3.0-or-later

M7-prep OPFS/WasmFS probe UI. Runs the wasm probe (WasmFS+OPFS mount, 100 MB
round-trip, persistence, concurrency) plus JS-side worker-only sync-handle
characterization. Load with ?fresh=1 to wipe OPFS first (clean "first load");
reload WITHOUT the param to verify persistence across a fresh wasm instance.
-->
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>blender-web OPFS probe</title>
  <style>
    :root { color-scheme: dark; }
    body { margin:0; font:14px/1.5 -apple-system, system-ui, sans-serif; background:#14171c; color:#d6dce4; }
    header { padding:12px 20px; background:#1b1f26; border-bottom:1px solid #2b313b; }
    header h1 { margin:0; font-size:15px; }
    header .hint { font-size:12px; color:#8791a0; margin-top:4px; }
    main { padding:16px 20px; }
    #log { margin:0; padding:10px 12px; background:#0e1116; border:1px solid #2b313b; border-radius:6px;
           font:12px/1.5 ui-monospace, Menlo, monospace; color:#cfd6df; white-space:pre-wrap; max-height:80vh; overflow:auto; }
    #log .ok { color:#92e0a5; } #log .bad { color:#ff8f8f; } #log .sys { color:#7f8aa0; } #log .warn { color:#e0cf92; }
  </style>
</head>
<body>
  <header>
    <h1>blender-web &mdash; M7-prep WasmFS + OPFS probe</h1>
    <div class="hint">?fresh=1 wipes OPFS for a clean first load; reload without it to verify persistence.</div>
  </header>
  <main><pre id="log"></pre></main>
  <script src="/boot.js"></script>
  <script src="/opfs_probe.js"></script>
  <script>window.__startOpfsProbe && window.__startOpfsProbe();</script>
</body>
</html>
