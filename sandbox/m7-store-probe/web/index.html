<!DOCTYPE html>
<!--
SPDX-FileCopyrightText: 2026 blender-web contributors
SPDX-License-Identifier: GPL-3.0-or-later

M7 project-store prototype UI. Mounts the designed OPFS store at /projects, writes a
REAL corpus .blend + the config/recovery artifacts, lists the directory (the
recent-files / account-sync seam), and times a 50 MB .blend save/load. Load with
?fresh=1 to wipe OPFS first (clean "first load"); reload WITHOUT the param to verify
persistence across a fresh wasm instance.
-->
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>blender-web M7 store probe</title>
  <style>
    :root { color-scheme: dark; }
    body { margin:0; font:14px/1.5 -apple-system, system-ui, sans-serif; background:#14171c; color:#d6dce4; }
    header { padding:12px 20px; background:#1b1f26; border-bottom:1px solid #2b313b; }
    header h1 { margin:0; font-size:15px; }
    header .hint { font-size:12px; color:#8791a0; margin-top:4px; }
    main { padding:16px 20px; }
    #log { margin:0; padding:10px 12px; background:#0e1116; border:1px solid #2b313b; border-radius:6px;
           font:12px/1.5 ui-monospace, Menlo, monospace; color:#cfd6df; white-space:pre-wrap; max-height:80vh; overflow:auto; }
    #log .ok { color:#92e0a5; } #log .bad { color:#ff8f8f; } #log .sys { color:#7f8aa0; } #log .warn { color:#e0cf92; }
  </style>
</head>
<body>
  <header>
    <h1>blender-web &mdash; M7 OPFS project-store prototype</h1>
    <div class="hint">Mounts /projects on OPFS, writes a real .blend + config/recovery artifacts, lists the dir, times 50&nbsp;MB. ?fresh=1 wipes OPFS; reload without it to verify persistence.</div>
  </header>
  <main><pre id="log"></pre></main>
  <script src="/boot.js"></script>
  <script src="/m7_store_probe.js"></script>
  <script>window.__startStoreProbe && window.__startStoreProbe();</script>
</body>
</html>
