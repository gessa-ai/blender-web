version = 1

# Read-only upstream Blender checkout, pinned at fbe6228777e7 (Blender 5.2 LTS).
# Blender's own files carry per-file SPDX headers; this blanket guarantees REUSE
# coverage for any that do not. Third-party licenses under upstream/extern are
# refined in THIRD-PARTY.md as they are audited.
[[annotations]]
path = "upstream/**"
precedence = "aggregate"
SPDX-FileCopyrightText = "Blender Authors"
SPDX-License-Identifier = "GPL-2.0-or-later"

# Project legal, attribution and provenance documents. Part of the shipped
# GPL-3.0-or-later aggregate.
[[annotations]]
path = ["LICENSE", "NOTICE", "PROVENANCE.md", "THIRD-PARTY.md", "REUSE.toml"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 blender-web contributors"
SPDX-License-Identifier = "GPL-3.0-or-later"

# Ledger, notes and reports: project data we author. Dedicated to the public
# domain so it imposes no downstream conditions.
[[annotations]]
path = ["ledger/**", "notes/**", "reports/**"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 blender-web contributors"
SPDX-License-Identifier = "CC0-1.0"

# Locked scripts we cannot inline-header: .claude/harness.lock write-protects
# harness/** and oracle/**, so cover their executable scripts by glob (REUSE 3.3
# annotations). Part of the GPL-3.0-or-later aggregate like the rest of the
# port machinery (loop/worker/bootstrap/hooks/sandbox carry inline headers).
[[annotations]]
path = ["harness/**", "oracle/bpy.sh"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 blender-web contributors"
SPDX-License-Identifier = "GPL-3.0-or-later"

# Port patches against upstream Blender source (diffs begin with `diff --git`,
# so an inline header would corrupt them). Derived from GPL-2.0-or-later upstream
# files, so they carry upstream's terms.
[[annotations]]
path = "patches/*.patch"
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 blender-web contributors"
SPDX-License-Identifier = "GPL-2.0-or-later"

# Authored config, pins, sentinels and prose docs where an inline SPDX header is
# awkward (JSON/.gitignore), forbidden (locked oracle/ pins) or edit-frozen mid
# session (GOAL.md/CLAUDE.md, thrift rule 5). Public-domain dedication — no
# downstream conditions.
[[annotations]]
path = [
  "CLAUDE.md",
  "LAUNCH.md",
  "SETUP.md",
  "fix_plan.md",
  ".gitignore",
  ".claude/settings.json",
  "oracle/PIN",
  "oracle/TOOLCHAIN",
  "scripts/bootstrap.done",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 blender-web contributors"
SPDX-License-Identifier = "CC0-1.0"

# GOAL.md is the driver prompt (prose). It quotes an SPDX template inline
# ("SPDX-License-Identifier: GPL-2.0-or-later ..."), which the linter would misread
# as this file's own (invalid) license expression. precedence = "override" makes
# REUSE take licensing solely from here and skip scanning the file body. Left
# un-edited on purpose so the prompt prefix stays byte-stable (thrift rule 5).
[[annotations]]
path = "GOAL.md"
precedence = "override"
SPDX-FileCopyrightText = "2026 blender-web contributors"
SPDX-License-Identifier = "CC0-1.0"

# Generated data, baselines, probe artifacts, and evidence files under sandbox/ —
# outputs of our own tooling; no meaningful authorship beyond the generating scripts
# (which carry inline headers). Driver decision at the M2 boundary (see notes/harness-issues.md style).
[[annotations]]
path = ["sandbox/**/*.txt", "sandbox/**/*.tsv", "sandbox/**/*.json", "sandbox/**/*.blend", "sandbox/**/*.wasm", "sandbox/**/*.js", "sandbox/**/*.data", "sandbox/**/*.log", "sandbox/**/*.cmp.txt", "sandbox/**/.gitignore", "platform_web/ghost/.gitignore", "sandbox/**/*.c", "sandbox/**/*.cpp", "sandbox/**/*.py", "sandbox/**/*.sh", "sandbox/**/*.list", "sandbox/**/*.mjs", "sandbox/**/*.html", "sandbox/**/*.png", "sandbox/**/*.exr", "sandbox/**/*.tar.gz", "sandbox/**/*.pyc"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 blender-web contributors"
SPDX-License-Identifier = "CC0-1.0"

# Vendored fmt source tree fetched by the memory64 probe (untracked in git; present on
# disk only after reproducing the probe). Upstream fmt is MIT. LICENSES/MIT.txt is NOT
# kept committed: with the tree absent this annotation matches nothing and reuse lint
# fails on the unused license text — run `reuse download MIT` when re-materializing
# (documented in sandbox/memory64-probe/README.md).
[[annotations]]
path = ["sandbox/memory64-probe/fmt-12.1.0/**"]
precedence = "aggregate"
SPDX-FileCopyrightText = "Victor Zverovich and fmt contributors"
SPDX-License-Identifier = "MIT"
