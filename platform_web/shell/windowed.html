<!DOCTYPE html>
<!--
SPDX-FileCopyrightText: 2026 blender-web contributors
SPDX-License-Identifier: GPL-2.0-or-later

M4 WINDOWED browser boot shell for the blender-web port - NATIVE-APP posture.
Loads the browser-linked `blender_browser` wasm module (WITH_HEADLESS=OFF,
GHOST-web + WebGPU backend) in a real tab and boots Blender WINDOWED (no
--background): creator.cc takes the WM_init_splash_on_startup + WM_main arm and
drives a real <canvas> via the GHOST-web window + emdawnwebgpu context.

Shell contract (native feel):
  - Boots IMMEDIATELY on load (no Boot button); the whole page is black.
  - The <canvas> fills the entire window at a devicePixelRatio-correct backing
    store (sharp, not CSS-stretched). GHOST-web reads the backing extent via
    emscripten_get_canvas_element_size; the WebGPU surface reconfigures on resize
    (GHOST_ContextWGPUWeb::configureSurface / on_resize in GHOST_EventBridgeWeb).
  - A minimal centred loading indicator vanishes when first pixels composite.
  - No HTML context menu / scroll / selection / pinch-zoom - input reaches Blender.

Verification/gate contract (PRESERVED - the M4 rig depends on it):
  - `?pyexpr=` and `?args=` dev hooks unchanged (see boot-windowed.js).
  - `window.__bwModule` still exposed after module init.
  - `?gate=WxH` renders the canvas at EXACTLY that CSS+backing size (DPR forced to
    1), centred on black, no loading UI - for the golden comparator.
  - A DOM-visible "main loop (WM_main)" state marker is still emitted (hidden
    #state element) so existing waitForFunction rigs still match.

Fully local / CSP-clean: no external assets.
-->
<html lang="en">
<head>
  <meta charset="utf-8" />
  <!-- viewport-fit=cover + user-scalable=no: no browser pinch/double-tap zoom. -->
  <meta name="viewport"
        content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>Source-derived WebAssembly editor preview</title>
  <link rel="preload" href="/fonts/bw-interface-sans.woff2" as="font"
        type="font/woff2" crossorigin />
  <style>
    @font-face {
      font-family: "BW Interface Sans";
      src: url("/fonts/bw-interface-sans.woff2") format("woff2");
      font-style: normal;
      font-weight: 400;
      font-display: swap;
    }
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }

    /* Native-app page: pure black, no scroll, no rubber-band, no text selection,
       no long-press callout. See boot-windowed.js + notes/m4-shell-native.md for
       the per-measure sources. */
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #000;
      color: #d6dce4;
      overflow: hidden;                     /* no scrollbars ever */
      overscroll-behavior: none;            /* kill pull-to-refresh / scroll chaining */
      touch-action: none;                   /* app owns every touch gesture */
      -ms-touch-action: none;
      user-select: none;
      -webkit-user-select: none;
      -moz-user-select: none;
      -webkit-touch-callout: none;          /* iOS long-press callout off */
      -webkit-tap-highlight-color: transparent;
      font: 13px/1.4 "BW Interface Sans", system-ui, -apple-system,
        BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    /* Full-window canvas. Backing store (canvas.width/height) is set by JS to
       cssPx * devicePixelRatio for a sharp image; CSS keeps it edge-to-edge. */
    #canvas {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      display: block;
      background: #000;
      border: 0;
      outline: none;                        /* no focus ring on the app surface */
      touch-action: none;
      image-rendering: auto;
      cursor: default;
    }

    /* GATE mode (?gate=WxH): exact CSS+backing size, centred on black, DPR=1.
       The golden comparator captures the canvas at exactly WxH. */
    body.bw-gate {
      display: grid;
      place-items: center;
    }
    body.bw-gate #canvas {
      position: static;
      inset: auto;
      /* exact px width/height set inline by boot-windowed.js */
    }

    /* Minimal centred loading UI. Fades out on first pixels. */
    #loader {
      position: fixed;
      inset: 0;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #17181b;
      transition: opacity .5s ease;
      will-change: opacity;
    }
    #loader.bw-hidden {
      opacity: 0;
      pointer-events: none;
    }
    #loader.bw-gone {
      display: none;
    }
    .bw-loader-core {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }
    .bw-spinner {
      width: 24px;
      height: 24px;
      border: 1.5px solid #34363c;
      border-top-color: #d3d6dc;
      border-radius: 50%;
      animation: bw-spin .8s linear infinite;
    }
    @keyframes bw-spin { to { transform: rotate(360deg); } }
    .bw-track {
      width: min(240px, calc(100vw - 64px));
      height: 2px;
      background: #34363c;
      border-radius: 2px;
      overflow: hidden;
    }
    #bw-fill {
      height: 100%;
      width: 0%;
      background: #d3d6dc;
      border-radius: 2px;
      transition: width .18s ease;
    }
    #bw-pct {
      color: #969ba5;
      font-size: 11px;
      line-height: 1;
      font-variant-numeric: tabular-nums;
    }
    #bw-legal-footer {
      position: absolute;
      right: 16px;
      bottom: max(12px, env(safe-area-inset-bottom));
      left: 16px;
      color: #737781;
      text-align: center;
      font-size: 9px;
      line-height: 1.2;
      white-space: nowrap;
    }
    #bw-source-link { color: #a9adb5; }

    @media (prefers-reduced-motion: reduce) {
      .bw-spinner { animation-duration: 1.6s; }
      #loader, #bw-fill { transition: none; }
    }

    /* Hidden diagnostics: preserved DOM contract for boot-windowed.js AND the M4
       verification rigs (the "main loop (WM_main)" state marker, exit/wall/dl,
       argv, the boot log, and an idempotent #run for rigs that click it). Kept in
       the DOM but visually removed - never shown in the native view. */
    #bw-diag {
      position: fixed;
      left: -99999px;
      top: -99999px;
      width: 1px;
      height: 1px;
      overflow: hidden;
      opacity: 0;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <canvas id="canvas" width="1280" height="720" tabindex="0" autofocus></canvas>

  <div id="loader" aria-live="polite" aria-busy="true" aria-label="Loading editor">
    <div class="bw-loader-core">
      <div id="bw-spinner" class="bw-spinner" aria-hidden="true"></div>
      <div id="bw-progress" class="bw-track" role="progressbar" aria-labelledby="bw-pct"
           aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
        <div id="bw-fill"></div>
      </div>
      <div id="bw-pct">0%</div>
    </div>
    <footer id="bw-legal-footer">
      <a id="bw-source-link" href="https://github.com/gessa-ai/blender-web"
         rel="noopener noreferrer">Source code (GPL)</a>
      <span aria-hidden="true"> · </span>Not affiliated with, endorsed by, or sponsored by the Blender Foundation. Blender® is a registered trademark of the Blender Foundation.
    </footer>
  </div>

  <!-- Hidden - verification/gate contract. Do not show in the native view. -->
  <div id="bw-diag" aria-hidden="true">
    <span id="state" class="state-idle" data-state="idle">state: idle</span>
    <span id="exit">-</span>
    <span id="wall">-</span>
    <span id="dl">-</span>
    <span id="argv"></span>
    <button id="run" type="button" tabindex="-1">boot</button>
    <pre id="log"></pre>
  </div>

  <!-- Must remain the first executable script: CSP permits same-origin scripts,
       not inline code. It installs append-only error observers before Blender. -->
  <script src="/diagnostics-bootstrap.js"></script>
  <script src="/bin/blender_browser.js"></script>
  <!-- M7b file bridge: .blend drag-drop + File System Access open/save (+ fallbacks)
       + OPFS persistence. Loaded BEFORE boot-windowed.js so the boot can append the
       worker daemon's --python-expr and call attach() after the module resolves. -->
  <script src="/file-bridge.js"></script>
  <script src="/boot-windowed.js"></script>
</body>
</html>
