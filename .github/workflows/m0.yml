name: M0 toolchain and oracle structure

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: m0-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  m0:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      EMSDK_REPO_COMMIT: 1ab2e627b1a84567f5284d1baaa5f6be7ccf07de
      EMSDK_VERSION: 6.0.5
      EM_CACHE: ${{ github.workspace }}/.ci-cache/emscripten
      CCACHE_DIR: ${{ github.workspace }}/.ci-cache/ccache

    steps:
      - name: Checkout without stored credentials
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: REUSE lint
        uses: fsfe/reuse-action@676e2d560c9a403aa252096d99fcab3e1132b0f5 # v6.0.0

      - name: Static pin and Dockerfile checks
        run: python3 scripts/m0-selfcheck.py

      - name: Restore Emscripten system cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ env.EM_CACHE }}
          key: em-cache-${{ runner.os }}-6.0.5-dbd755b5da399329c2576f6e3dfa7f419f5d8409

      - name: Restore ccache object cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-${{ runner.os }}-6.0.5-dbd755b5da399329c2576f6e3dfa7f419f5d8409

      - name: Install host compiler cache
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ccache

      - name: Install exact emsdk
        run: |
          git clone --filter=blob:none --no-checkout https://github.com/emscripten-core/emsdk.git tools/emsdk
          git -C tools/emsdk checkout --detach "$EMSDK_REPO_COMMIT"
          test "$(git -C tools/emsdk rev-parse HEAD)" = "$EMSDK_REPO_COMMIT"
          tools/emsdk/emsdk install "$EMSDK_VERSION"
          tools/emsdk/emsdk activate "$EMSDK_VERSION"

      - name: Fail-closed M0 executable checks
        run: M0_VERIFY_UPSTREAM_FETCH=1 bash scripts/ci/m0-basic.sh
